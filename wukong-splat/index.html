<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>孙悟空 · 3D 在线预览</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(145deg,#fff5db,#f6efe4);color:#4b3023}header{position:absolute;z-index:2;top:18px;left:22px;pointer-events:none}h1{font-size:27px;margin:0}p{margin:6px 0;color:#947453;font-size:13px}#view{height:100dvh;width:100vw;touch-action:none}footer{position:absolute;bottom:15px;text-align:center;width:100%;font-size:13px;color:#8c735a;pointer-events:none}span{background:#fff9;padding:8px 15px;border-radius:25px} .controls{position:absolute;top:84px;left:22px;z-index:4;display:flex;gap:8px;flex-wrap:wrap}.controls button{border:1px solid #cfb897;border-radius:12px;background:#fffdf3;color:#65442a;padding:9px 12px;cursor:pointer;font-weight:700}.controls button.active{background:#c84431;border-color:#c84431;color:white}.info{position:absolute;top:132px;left:22px;right:22px;z-index:3;color:#906e53;font-size:12px;pointer-events:none;max-width:390px}</style></head><body><header><h1>🐒 Wukong · 孙悟空</h1><p>3D IP 原型 · 可交互预览</p></header><nav class="controls"><button id="mix" class="active">融合渲染</button><button id="splat">高斯泼溅</button><button id="mesh">原始网格</button></nav><div class="info">程序化几何采样生成的 Gaussian splats；并非照片训练的 3DGS 重建。</div><div id="view"></div><footer><span>拖动旋转 · 双指缩放 · 自动旋转</span></footer><script type="module">import * as T from 'https://esm.sh/three@0.167.1';import{OrbitControls}from'https://esm.sh/three@0.167.1/examples/jsm/controls/OrbitControls.js';const scene=new T.Scene();scene.background=new T.Color('#fff4df');const camera=new T.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);camera.up.set(0,0,1);camera.position.set(6,-11,6);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;document.getElementById('view').appendChild(renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0xba9865,2.6));const key=new T.DirectionalLight(0xffffff,3);key.position.set(-4,-6,10);scene.add(key);const fill=new T.DirectionalLight(0xffffff,1);fill.position.set(5,4,5);scene.add(fill);const mat={};for(const[k,c]of Object.entries({fur:'#885138',hair:'#9b5b3d',skin:'#f5cca8',cream:'#ffe1be',red:'#c72c29',redDark:'#9e1d21',gold:'#e5ae3c',goldLight:'#ffd568',brown:'#4f3026',eye:'#251c1a',white:'#fff8ee',pink:'#ec997e'}))mat[k]=new T.MeshStandardMaterial({color:c,roughness:k.startsWith('gold')?.38:.86,metalness:k.startsWith('gold')?.53:0});const hero=new T.Group();scene.add(hero);function ell(p,s,m){const o=new T.Mesh(new T.SphereGeometry(1,22,14),mat[m]);o.position.set(...p);o.scale.set(...s);hero.add(o);return o}function cyl(a,b,r,m){const aa=new T.Vector3(...a),bb=new T.Vector3(...b),d=bb.clone().sub(aa),o=new T.Mesh(new T.CylinderGeometry(r,r,d.length(),14),mat[m]);o.position.copy(aa.add(bb).multiplyScalar(.5));o.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d.normalize());hero.add(o);return o}function cone(a,b,r,m){const aa=new T.Vector3(...a),bb=new T.Vector3(...b),d=bb.clone().sub(aa),o=new T.Mesh(new T.ConeGeometry(r,d.length(),11),mat[m]);o.position.copy(aa.add(bb).multiplyScalar(.5));o.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d.normalize());hero.add(o)}function tube(points,r,m){for(let i=0;i<points.length-1;i++)cyl(points[i],points[i+1],r,m)}ell([0,0,1.03],[.61,.46,.76],'brown');ell([0,-.43,1],[.46,.12,.49],'fur');ell([0,0,2.46],[.99,.83,.92],'skin');ell([0,-.55,2.23],[.75,.4,.54],'cream');for(let s of[-1,1]){ell([s*.96,-.02,2.53],[.32,.18,.37],'fur');ell([s*1.04,-.185,2.56],[.22,.065,.25],'pink');ell([s*.42,-.766,2.62],[.39,.072,.38],'red');ell([s*.42,-.822,2.59],[.26,.065,.27],'white');ell([s*.43,-.88,2.58],[.165,.042,.195],'eye');ell([s*.38,-.914,2.67],[.052,.022,.064],'white');ell([s*.67,-.691,2.22],[.18,.034,.11],'pink');cyl([s*.54,0,1.53],[s*.86,-.08,.98],.23,'fur');ell([s*.9,-.13,.91],[.25,.25,.24],'skin');ell([s*.61,-.01,1.52],[.33,.31,.22],'gold');cyl([s*.31,0,.56],[s*.35,-.06,.25],.25,'fur');ell([s*.36,-.2,.19],[.32,.38,.20],'brown');ell([s*.36,-.41,.18],[.32,.16,.13],'gold')}ell([0,-.943,2.29],[.10,.065,.075],'fur');tube([[-.17,-.916,2.15],[-.08,-.965,2.11],[0,-.979,2.105],[.1,-.957,2.13],[.18,-.904,2.18]],.023,'brown');ell([0,.18,2.99],[.95,.74,.60],'hair');[[13,.73,3.2,.55],[10,.52,3.44,.48],[7,.29,3.56,.42]].forEach(([n,rad,z,length],ring)=>{for(let i=0;i<n;i++){let a=2*Math.PI*i/n+ring*.17,x=rad*Math.cos(a),y=.15+rad*.7*Math.sin(a);cone([x,y,z-.08],[x+.21*Math.cos(a),y+.13*Math.sin(a),z+length],ring<2?.19:.17,'hair')}});const loop=[];for(let i=0;i<=28;i++){let t=2*Math.PI*i/28;loop.push([.96*Math.cos(t),.15+.78*Math.sin(t),2.995+.045*Math.cos(2*t)])}tube(loop,.07,'gold');for(let s of[-1,1])tube([[s*.09,-.69,3.05],[s*.22,-.72,3.11],[s*.3,-.73,3.21],[s*.28,-.73,3.31],[s*.19,-.735,3.34],[s*.15,-.735,3.27]],.075,'goldLight');ell([0,-.14,1.67],[.56,.47,.17],'red');ell([0,-.535,1.65],[.18,.14,.17],'redDark');for(let s of[-1,1])ell([s*.30,-.53,1.48],[.26,.10,.13],'red');cyl([-.53,-.45,.91],[.53,-.45,.91],.085,'gold');ell([0,-.555,.92],[.21,.075,.19],'goldLight');for(let s of[-1,1])ell([s*.29,-.36,.58],[.24,.12,.31],'redDark');tube([[.18,.38,.82],[.55,.6,.75],[.91,.58,.86],[1.23,.44,1.1],[1.25,.29,1.35],[1.08,.19,1.48]],.115,'fur');ell([1.08,.19,1.48],[.16,.15,.16],'hair');const a=[-.95,-.83,.35],b=[1.12,-.87,2.45],d=b.map((v,i)=>v-a[i]);cyl(a,b,.065,'red');for(const t of[.015,.1,.89,.98]){let p=a.map((v,i)=>v+d[i]*t),u=d.map(v=>v/Math.hypot(...d));cyl(p.map((v,i)=>v-u[i]*.045),p.map((v,i)=>v+u[i]*.045),.105,'gold')}for(const t of[.025,.965]){let p=a.map((v,i)=>v+d[i]*t),u=d.map(v=>v/Math.hypot(...d));cyl(p.map((v,i)=>v-u[i]*.1),p.map((v,i)=>v+u[i]*.1),.13,'goldLight')}const ground=new T.Mesh(new T.CylinderGeometry(1.85,1.9,.12,64),new T.MeshStandardMaterial({color:'#eac68c',roughness:.9}));ground.position.z=-.1;ground.rotation.x=Math.PI/2;scene.add(ground);
const faces=[], cumulative=[];let sum=0;
hero.updateMatrixWorld(true);
const pa=new T.Vector3(),pb=new T.Vector3(),pc=new T.Vector3(),ab=new T.Vector3(),ac=new T.Vector3();
for(const m of hero.children){if(!m.isMesh)continue;const g=m.geometry,arr=g.attributes.position,idx=g.index;const count=idx?idx.count:arr.count;for(let j=0;j<count-2;j+=3){const i0=idx?idx.getX(j):j,i1=idx?idx.getX(j+1):j+1,i2=idx?idx.getX(j+2):j+2;pa.fromBufferAttribute(arr,i0).applyMatrix4(m.matrixWorld);pb.fromBufferAttribute(arr,i1).applyMatrix4(m.matrixWorld);pc.fromBufferAttribute(arr,i2).applyMatrix4(m.matrixWorld);const area=ab.subVectors(pb,pa).cross(ac.subVectors(pc,pa)).length()/2;if(area<1e-8)continue;sum+=area;faces.push([pa.x,pa.y,pa.z,pb.x,pb.y,pb.z,pc.x,pc.y,pc.z,m.material.color.r,m.material.color.g,m.material.color.b]);cumulative.push(sum)}}
const num=52000,positions=new Float32Array(num*3),colors=new Float32Array(num*3),sizes=new Float32Array(num);
for(let i=0;i<num;i++){const target=Math.random()*sum;let lo=0,hi=cumulative.length-1;while(lo<hi){let mid=(lo+hi)>>1;if(cumulative[mid]<target)lo=mid+1;else hi=mid}const f=faces[lo],r=Math.sqrt(Math.random()),t=Math.random(),a=1-r,b=r*(1-t),c=r*t;for(let k=0;k<3;k++)positions[i*3+k]=a*f[k]+b*f[k+3]+c*f[k+6];for(let k=0;k<3;k++)colors[i*3+k]=f[9+k];sizes[i]=Math.random()*.7+.85}
const cloudGeometry=new T.BufferGeometry();cloudGeometry.setAttribute('position',new T.BufferAttribute(positions,3));cloudGeometry.setAttribute('color',new T.BufferAttribute(colors,3));cloudGeometry.setAttribute('aSize',new T.BufferAttribute(sizes,1));
const cloudMaterial=new T.ShaderMaterial({transparent:true,depthWrite:false,vertexColors:true,uniforms:{scale:{value:1.0},opacity:{value:.72}},vertexShader:`attribute float aSize;varying vec3 vColor;uniform float scale;void main(){vColor=color;vec4 p=modelViewMatrix*vec4(position,1.);gl_Position=projectionMatrix*p;gl_PointSize=clamp(scale*aSize*115.0/max(2.0,-p.z),1.5,22.0);}`,fragmentShader:`varying vec3 vColor;uniform float opacity;void main(){vec2 p=gl_PointCoord*2.-1.;float q=dot(p,p);if(q>1.)discard;float alpha=exp(-4.0*q)*opacity;gl_FragColor=vec4(vColor,alpha);}`});
const cloud=new T.Points(cloudGeometry,cloudMaterial);cloud.renderOrder=2;scene.add(cloud);
const buttons=['mix','splat','mesh'];function mode(id){buttons.forEach(k=>document.getElementById(k).classList.toggle('active',k===id));for(const m of hero.children)m.visible=id!=='splat';cloud.visible=id!=='mesh';cloudMaterial.uniforms.opacity.value=id==='splat'?.95:.62;cloudMaterial.uniforms.scale.value=id==='splat'?1.45:1.0}
buttons.forEach(k=>document.getElementById(k).onclick=()=>mode(k));mode('mix');
const ctrl=new OrbitControls(camera,renderer.domElement);ctrl.target.set(0,0,2);ctrl.enableDamping=true;ctrl.autoRotate=true;ctrl.autoRotateSpeed=1.2;ctrl.minDistance=4;ctrl.maxDistance=20;ctrl.update();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function animate(){requestAnimationFrame(animate);ctrl.update();renderer.render(scene,camera)}animate();</script></body></html>
