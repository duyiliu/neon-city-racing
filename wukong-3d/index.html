<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>孙悟空 · 3D 在线预览</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(145deg,#fff5db,#f6efe4);color:#4b3023}header{position:absolute;z-index:2;top:18px;left:22px;pointer-events:none}h1{font-size:27px;margin:0}p{margin:6px 0;color:#947453;font-size:13px}#view{height:100dvh;width:100vw;touch-action:none}footer{position:absolute;bottom:15px;text-align:center;width:100%;font-size:13px;color:#8c735a;pointer-events:none}span{background:#fff9;padding:8px 15px;border-radius:25px}</style></head><body><header><h1>🐒 Wukong · 孙悟空</h1><p>3D IP 原型 · 可交互预览</p></header><div id="view"></div><footer><span>拖动旋转 · 双指缩放 · 自动旋转</span></footer><script type="module">import * as T from 'https://esm.sh/three@0.167.1';import{OrbitControls}from'https://esm.sh/three@0.167.1/examples/jsm/controls/OrbitControls.js';const scene=new T.Scene();scene.background=new T.Color('#fff4df');const camera=new T.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);camera.position.set(6,-11,6);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;document.getElementById('view').appendChild(renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0xba9865,2.6));const key=new T.DirectionalLight(0xffffff,3);key.position.set(-4,-6,10);scene.add(key);const fill=new T.DirectionalLight(0xffffff,1);fill.position.set(5,4,5);scene.add(fill);const mat={};for(const[k,c]of Object.entries({fur:'#885138',hair:'#9b5b3d',skin:'#f5cca8',cream:'#ffe1be',red:'#c72c29',redDark:'#9e1d21',gold:'#e5ae3c',goldLight:'#ffd568',brown:'#4f3026',eye:'#251c1a',white:'#fff8ee',pink:'#ec997e'}))mat[k]=new T.MeshStandardMaterial({color:c,roughness:k.startsWith('gold')?.38:.86,metalness:k.startsWith('gold')?.53:0});const hero=new T.Group();scene.add(hero);function ell(p,s,m){const o=new T.Mesh(new T.SphereGeometry(1,22,14),mat[m]);o.position.set(...p);o.scale.set(...s);hero.add(o);return o}function cyl(a,b,r,m){const aa=new T.Vector3(...a),bb=new T.Vector3(...b),d=bb.clone().sub(aa),o=new T.Mesh(new T.CylinderGeometry(r,r,d.length(),14),mat[m]);o.position.copy(aa.add(bb).multiplyScalar(.5));o.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d.normalize());hero.add(o);return o}function cone(a,b,r,m){const aa=new T.Vector3(...a),bb=new T.Vector3(...b),d=bb.clone().sub(aa),o=new T.Mesh(new T.ConeGeometry(r,d.length(),11),mat[m]);o.position.copy(aa.add(bb).multiplyScalar(.5));o.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d.normalize());hero.add(o)}function tube(points,r,m){for(let i=0;i<points.length-1;i++)cyl(points[i],points[i+1],r,m)}ell([0,0,1.03],[.61,.46,.76],'brown');ell([0,-.43,1],[.46,.12,.49],'fur');ell([0,0,2.46],[.99,.83,.92],'skin');ell([0,-.55,2.23],[.75,.4,.54],'cream');for(let s of[-1,1]){ell([s*.96,-.02,2.53],[.32,.18,.37],'fur');ell([s*1.04,-.185,2.56],[.22,.065,.25],'pink');ell([s*.42,-.766,2.62],[.39,.072,.38],'red');ell([s*.42,-.822,2.59],[.26,.065,.27],'white');ell([s*.43,-.88,2.58],[.165,.042,.195],'eye');ell([s*.38,-.914,2.67],[.052,.022,.064],'white');ell([s*.67,-.691,2.22],[.18,.034,.11],'pink');cyl([s*.54,0,1.53],[s*.86,-.08,.98],.23,'fur');ell([s*.9,-.13,.91],[.25,.25,.24],'skin');ell([s*.61,-.01,1.52],[.33,.31,.22],'gold');cyl([s*.31,0,.56],[s*.35,-.06,.25],.25,'fur');ell([s*.36,-.2,.19],[.32,.38,.20],'brown');ell([s*.36,-.41,.18],[.32,.16,.13],'gold')}ell([0,-.943,2.29],[.10,.065,.075],'fur');tube([[-.17,-.916,2.15],[-.08,-.965,2.11],[0,-.979,2.105],[.1,-.957,2.13],[.18,-.904,2.18]],.023,'brown');ell([0,.18,2.99],[.95,.74,.60],'hair');[[13,.73,3.2,.55],[10,.52,3.44,.48],[7,.29,3.56,.42]].forEach(([n,rad,z,length],ring)=>{for(let i=0;i<n;i++){let a=2*Math.PI*i/n+ring*.17,x=rad*Math.cos(a),y=.15+rad*.7*Math.sin(a);cone([x,y,z-.08],[x+.21*Math.cos(a),y+.13*Math.sin(a),z+length],ring<2?.19:.17,'hair')}});const loop=[];for(let i=0;i<=28;i++){let t=2*Math.PI*i/28;loop.push([.96*Math.cos(t),.15+.78*Math.sin(t),2.995+.045*Math.cos(2*t)])}tube(loop,.07,'gold');for(let s of[-1,1])tube([[s*.09,-.69,3.05],[s*.22,-.72,3.11],[s*.3,-.73,3.21],[s*.28,-.73,3.31],[s*.19,-.735,3.34],[s*.15,-.735,3.27]],.075,'goldLight');ell([0,-.14,1.67],[.56,.47,.17],'red');ell([0,-.535,1.65],[.18,.14,.17],'redDark');for(let s of[-1,1])ell([s*.30,-.53,1.48],[.26,.10,.13],'red');cyl([-.53,-.45,.91],[.53,-.45,.91],.085,'gold');ell([0,-.555,.92],[.21,.075,.19],'goldLight');for(let s of[-1,1])ell([s*.29,-.36,.58],[.24,.12,.31],'redDark');tube([[.18,.38,.82],[.55,.6,.75],[.91,.58,.86],[1.23,.44,1.1],[1.25,.29,1.35],[1.08,.19,1.48]],.115,'fur');ell([1.08,.19,1.48],[.16,.15,.16],'hair');const a=[-.95,-.83,.35],b=[1.12,-.87,2.45],d=b.map((v,i)=>v-a[i]);cyl(a,b,.065,'red');for(const t of[.015,.1,.89,.98]){let p=a.map((v,i)=>v+d[i]*t),u=d.map(v=>v/Math.hypot(...d));cyl(p.map((v,i)=>v-u[i]*.045),p.map((v,i)=>v+u[i]*.045),.105,'gold')}for(const t of[.025,.965]){let p=a.map((v,i)=>v+d[i]*t),u=d.map(v=>v/Math.hypot(...d));cyl(p.map((v,i)=>v-u[i]*.1),p.map((v,i)=>v+u[i]*.1),.13,'goldLight')}const ground=new T.Mesh(new T.CylinderGeometry(1.85,1.9,.12,64),new T.MeshStandardMaterial({color:'#eac68c',roughness:.9}));ground.position.z=-.1;ground.rotation.x=Math.PI/2;scene.add(ground);const ctrl=new OrbitControls(camera,renderer.domElement);ctrl.target.set(0,0,2);ctrl.enableDamping=true;ctrl.autoRotate=true;ctrl.autoRotateSpeed=1.2;ctrl.minDistance=4;ctrl.maxDistance=20;ctrl.update();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function animate(){requestAnimationFrame(animate);ctrl.update();renderer.render(scene,camera)}animate();</script></body></html>
